<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class=".header">
      <h1>Calculate soil moisture using linear interpolation</h1>
    </header>
    <main>
      <div class="row">
        <div class="box first"></div>
        <div class="box middle"></div>
        <div class="box last"></div>
      </div>
      <div class="slider-container">
        <label for="fSlider">Point <i>a</i></label>
        <input type="range" name="" id="fSlider" class="fSlider slider" />
        <label for="lSlider">Point <i>b</i></label>
        <input type="range" name="" id="lSlider" class="lSlider slider" />
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
